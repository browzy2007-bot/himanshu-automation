name: Himanshu Automation

on:
  # Checks Telegram for new topics every five minutes.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: himanshu-telegram-automation
  cancel-in-progress: false

jobs:
  telegram-and-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore Telegram update offset
        uses: actions/cache/restore@v4
        with:
          path: .telegram-state
          key: telegram-state-${{ github.run_id }}
          restore-keys: |
            telegram-state-

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pillow google-api-python-client google-auth

      - name: Poll Telegram and create requested videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: |
          mkdir -p .telegram-state output
          cat > automation.py <<'PY'
          import os, json, re, asyncio, subprocess, requests
          from pathlib import Path
          import edge_tts
          from PIL import Image, ImageDraw, ImageFont

          TOKEN = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          GEMINI = os.getenv("GEMINI_API_KEY", "").strip()
          STATE = Path(".telegram-state/offset")
          OUT = Path("output")
          OUT.mkdir(exist_ok=True)

          def tg(method, payload=None, timeout=30):
              if not TOKEN:
                  raise RuntimeError("Missing TELEGRAM_BOT_TOKEN secret.")
              r = requests.post(f"https://api.telegram.org/bot{TOKEN}/{method}",
                                json=payload or {}, timeout=timeout)
              r.raise_for_status()
              data = r.json()
              if not data.get("ok"):
                  raise RuntimeError(f"Telegram API error: {data}")
              return data["result"]

          def send(chat, text):
              tg("sendMessage", {"chat_id": chat, "text": text})

          def ask_ai(topic, fmt):
              if not GEMINI:
                  raise RuntimeError("Missing GEMINI_API_KEY secret.")
              words = "350-420" if fmt == "long" else "100-125"
              prompt = (
                  "Create an original, engaging YouTube facts video in Hinglish written in Roman Hindi. "
                  f"Topic: {topic}. Format: {fmt}. Narration length: {words} words. "
                  "Start with a strong hook, explain clearly, end naturally. "
                  "Do not invent statistics, dates, quotes, or claims. Add cautious wording if uncertain. "
                  "Return ONLY valid JSON with keys title, description, narration, fact_notes. "
                  "fact_notes should list brief claims to independently verify; do not claim sources were checked unless supplied."
              )
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
              r = requests.post(url, params={"key": GEMINI},
                  json={"contents":[{"parts":[{"text":prompt}]}],
                        "generationConfig":{"responseMimeType":"application/json","temperature":0.45}},
                  timeout=90)
              r.raise_for_status()
              raw = r.json()["candidates"][0]["content"]["parts"][0]["text"]
              raw = re.sub(r"^```(?:json)?|```$", "", raw.strip(), flags=re.M).strip()
              data = json.loads(raw)
              for k in ("title", "description", "narration"):
                  if not data.get(k):
                      raise RuntimeError(f"AI response missing {k}")
              return data

          async def make_voice(text, path):
              await edge_tts.Communicate(text, "en-IN-NeerjaNeural", rate="+2%").save(str(path))

          def font(size):
              path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              return ImageFont.truetype(path, size) if Path(path).exists() else ImageFont.load_default()

          def make_srt(text, duration, path):
              words = text.split()
              chunks = [" ".join(words[i:i+7]) for i in range(0, len(words), 7)]
              total = max(1, len(words))
              def stamp(t):
                  ms = int((t-int(t))*1000)
                  sec = int(t) % 60
                  mins = int(t) // 60
                  return f"{mins:02}:{sec:02},{ms:03}"
              cursor = 0
              with open(path, "w", encoding="utf-8") as f:
                  for i, chunk in enumerate(chunks, 1):
                      n = len(chunk.split())
                      start = duration * cursor / total
                      cursor += n
                      end = duration * cursor / total
                      f.write(f"{i}\n{stamp(start)} --> {stamp(max(start+0.5,end))}\n{chunk}\n\n")

          def create_video(meta, fmt, stem):
              audio = OUT / f"{stem}.mp3"
              asyncio.run(make_voice(meta["narration"], audio))
              width, height = (1280, 720) if fmt == "long" else (1080, 1920)
              bg = OUT / f"{stem}.png"
              im = Image.new("RGB", (width, height), (13, 24, 52))
              draw = ImageDraw.Draw(im)
              draw.rounded_rectangle((25,25,width-25,height-25), radius=35,
                                     outline=(80,160,225), width=5)
              draw.text((65,65), "HIMANSHU AUTOMATION", font=font(max(24,width//24)),
                        fill=(210,230,255))
              # Abstract branded background; no unlicensed stock footage.
              for i in range(16):
                  x = (i*197) % width
                  y = (i*283) % height
                  draw.ellipse((x-55,y-55,x+55,y+55), outline=(35,70,115), width=3)
              draw.multiline_text((65,height//3), meta["title"], font=font(max(30,width//18)),
                                  fill=(245,248,255), spacing=16)
              im.save(bg)
              probe = subprocess.run(
                  ["ffprobe","-v","error","-show_entries","format=duration",
                   "-of","default=noprint_wrappers=1:nokey=1",str(audio)],
                  capture_output=True, text=True, check=True)
              duration = float(probe.stdout.strip())
              srt = OUT / f"{stem}.srt"
              make_srt(meta["narration"], duration, srt)
              video = OUT / f"{stem}.mp4"
              size = f"{width}x{height}"
              vf = (f"scale={size}:force_original_aspect_ratio=increase,crop={size},"
                    f"zoompan=z='min(zoom+0.0004,1.06)':d=1:s={size}:fps=25,"
                    f"subtitles={srt}:force_style='FontName=DejaVu Sans,FontSize={28 if fmt=='short' else 30},"
                    "Bold=1,Outline=2,Shadow=1,Alignment=2,MarginV=70'")
              subprocess.run(["ffmpeg","-y","-loop","1","-i",str(bg),"-i",str(audio),
                  "-vf",vf,"-c:v","libx264","-tune","stillimage","-c:a","aac",
                  "-b:a","128k","-pix_fmt","yuv420p","-shortest","-movflags","+faststart",str(video)],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              return video

          def youtube_upload(video, meta):
              needed = ["YOUTUBE_CLIENT_ID","YOUTUBE_CLIENT_SECRET","YOUTUBE_REFRESH_TOKEN"]
              if not all(os.getenv(x) for x in needed):
                  return None
              from google.oauth2.credentials import Credentials
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload
              creds = Credentials(
                  None, refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ["YOUTUBE_CLIENT_ID"],
                  client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
                  scopes=["https://www.googleapis.com/auth/youtube.upload"])
              yt = build("youtube","v3",credentials=creds)
              privacy = os.getenv("YOUTUBE_PRIVACY","private").strip().lower()
              if privacy not in ("private","unlisted","public"):
                  privacy = "private"
              body = {"snippet":{"title":meta["title"][:100],
                       "description":meta["description"] + "\n\n#facts #Hinglish #SmashOfficial",
                       "categoryId":"27","tags":["facts","Hinglish","Himanshu Automation"]},
                      "status":{"privacyStatus":privacy}}
              media = MediaFileUpload(str(video), mimetype="video/mp4",
                                      chunksize=1024*1024, resumable=True)
              req = yt.videos().insert(part="snippet,status", body=body, media_body=media)
              response = None
              while response is None:
                  _, response = req.next_chunk()
              return "https://www.youtube.com/watch?v=" + response["id"]

          def handle(update):
              msg = update.get("message") or update.get("channel_post")
              if not msg or not msg.get("text"):
                  return
              chat = msg["chat"]["id"]
              text = msg["text"].strip()
              if text == "/start":
                  send(chat, "Himanshu Automation ready. Send /make <topic> for a Short or /long <topic> for a longer video.")
                  return
              if text.startswith("/make "):
                  fmt, topic = "short", text[6:].strip()
              elif text.startswith("/long "):
                  fmt, topic = "long", text[6:].strip()
              else:
                  send(chat, "Use /make <topic> or /long <topic>. Example: /make 3 strange facts about space")
                  return
              if len(topic) < 4 or len(topic) > 240:
                  send(chat, "Please send a topic between 4 and 240 characters.")
                  return
              send(chat, f"Received: {topic}\nCreating your {fmt} video now. This may take several minutes.")
              try:
                  meta = ask_ai(topic, fmt)
                  stem = "himanshu_" + str(update["update_id"])
                  (OUT / f"{stem}.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")
                  video = create_video(meta, fmt, stem)
                  link = youtube_upload(video, meta)
                  if link:
                      send(chat, "Video uploaded to YouTube: " + link)
                  else:
                      send(chat, "Video created, but YouTube is not connected yet. Download it from the GitHub Actions run Artifacts. We will connect your channel at the final step.")
              except Exception as e:
                  send(chat, "Video job failed: " + str(e)[:500])
                  raise

          def main():
              if not TOKEN:
                  raise SystemExit("Add TELEGRAM_BOT_TOKEN in GitHub repository Secrets.")
              offset = int(STATE.read_text().strip()) if STATE.exists() else 0
              result = tg("getUpdates", {"offset":offset, "timeout":5, "allowed_updates":["message"]}, timeout=15)
              updates = sorted(result, key=lambda x:x["update_id"])
              next_offset = offset
              for update in updates:
                  handle(update)
                  next_offset = max(next_offset, update["update_id"] + 1)
              STATE.parent.mkdir(exist_ok=True)
              STATE.write_text(str(next_offset))
              print(f"Checked Telegram. Processed {len(updates)} update(s).")
          if __name__ == "__main__":
              main()
          PY
          python automation.py

      - name: Save Telegram update offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .telegram-state
          key: telegram-state-${{ github.run_id }}

      - name: Save generated videos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: himanshu-automation-output
          path: output/
          retention-days: 3
